[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "storymotion"
version = "0.1.0"
description = "StoryMotion AI manga-drama creation platform"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "json-repair>=0.58,<1",
  "imageio-ffmpeg>=0.6,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
]
ui = [
  "streamlit>=1.59,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
